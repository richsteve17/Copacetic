name: Unzip Folder Automatically

on:
  push:
    branches:
      - main

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip archive
        run: |
          unzip *.zip -d extracted_files/

      - name: Commit and push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add extracted_files/
          git commit -m "Automated unzip: extracted archive files" || echo "No changes to commit"
          git push
